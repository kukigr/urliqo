<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urliqo – Generator Kalendarza</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f0f2f5; color: #1c1e21; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 100%; max-width: 520px; padding: 28px; }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 700; }
        p.subtitle { color: #606770; font-size: 14px; margin-bottom: 16px; }
        .input-wrapper { position: relative; margin-bottom: 12px; }
        input[type="url"] { width: 100%; padding: 12px 40px 12px 14px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 14px; outline: none; }
        input[type="url"]:focus { border-color: #1877f2; }
        .btn-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #e4e6eb; border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; display: none; align-items: center; justify-content: center; }
        button.btn-submit { width: 100%; background: #1877f2; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button.btn-submit:disabled { background: #e4e6eb; color: #bcc0c4; cursor: not-allowed; }
        .loader { display: none; text-align: center; margin-top: 16px; color: #1877f2; font-weight: 500; }
        .error-message { display: none; margin-top: 16px; color: #fa383e; font-size: 14px; }
        .error-details { font-size: 12px; color: #65676b; margin-top: 4px; }
        .results { display: none; margin-top: 20px; border-top: 1px solid #e4e6eb; padding-top: 20px; }
        .event-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .event-location { font-size: 13px; color: #606770; margin-bottom: 6px; }
        .event-source { font-size: 12px; color: #606770; margin-bottom: 16px; word-break: break-all; }
        .event-source a { color: #1877f2; text-decoration: none; }
        .days-list { display: flex; flex-direction: column; gap: 10px; }
        .day-card { background: #f7f8fa; border: 1px solid #e4e6eb; border-radius: 8px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
        .day-name { font-weight: 600; font-size: 14px; }
        .day-time { font-size: 12px; color: #606770; }
        .btn-calendar { background: #42b72a; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>📅</span>
            <h1>Urliqo</h1>
        </div>
        <p class="subtitle">Wklej link do wydarzenia:</p>

        <form id="eventForm">
            <div class="input-wrapper">
                <input type="url" id="urlInput" placeholder="https://..." required>
                <button type="button" class="btn-clear" id="btnClear">✕</button>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Generuj linki do Kalendarza</button>
        </form>

        <div class="loader" id="loader">⏳ Analizowanie wydarzenia...</div>
        <div class="error-message" id="errorMessage">
            <div id="errorTitle"></div>
            <div class="error-details" id="errorDetails"></div>
        </div>

        <div class="results" id="results">
            <div class="event-title" id="eventTitle"></div>
            <div class="event-location" id="eventLocation"></div>
            <div class="event-source" id="eventSource"></div>
            <div class="days-list" id="daysList"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('eventForm');
        const urlInput = document.getElementById('urlInput');
        const btnClear = document.getElementById('btnClear');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('errorMessage');
        const results = document.getElementById('results');

        urlInput.addEventListener('input', () => {
            btnClear.style.display = urlInput.value.length > 0 ? 'flex' : 'none';
        });

        btnClear.addEventListener('click', () => {
            urlInput.value = '';
            btnClear.style.display = 'none';
            errorMessage.style.display = 'none';
            results.style.display = 'none';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;

            errorMessage.style.display = 'none';
            results.style.display = 'none';
            loader.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/parse-event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!response.ok) {
                    document.getElementById('errorTitle').textContent = data.error || 'Błąd';
                    document.getElementById('errorDetails').textContent = data.details || '';
                    errorMessage.style.display = 'block';
                    return;
                }

                renderResults(data);
            } catch (err) {
                document.getElementById('errorTitle').textContent = 'Błąd połączenia z serwerem';
                document.getElementById('errorDetails').textContent = err.message;
                errorMessage.style.display = 'block';
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function renderResults(data) {
            document.getElementById('eventTitle').textContent = data.title;
            document.getElementById('eventLocation').textContent = data.location ? `📍 ${data.location}` : '📍 Brak lokalizacji';
            
            const rawUrl = data.source_url || urlInput.value.trim();
            document.getElementById('eventSource').innerHTML = `🔗 Wydarzenie wygenerowane z: <a href="${rawUrl}" target="_blank">${rawUrl}</a>`;

            const daysList = document.getElementById('daysList');
            daysList.innerHTML = '';

            data.days.forEach(day => {
                const startDate = new Date(day.start_time_utc);
                const endDate = new Date(day.end_time_utc);

                const formatDate = (d) => d.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
                const formatTime = (d) => d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });

                const gCalStart = startDate.toISOString().replace(/-|:|\.\d\d\d/g, '');
                const gCalEnd = endDate.toISOString().replace(/-|:|\.\d\d\d/g, '');

                // Budowanie parametru details (Opis + Link źródłowy)
                let fullDetails = '';
                if (data.description && data.description.trim() !== '') {
                    fullDetails += `${data.description.trim()}\n\n---\n`;
                }
                fullDetails += `Wydarzenie wygenerowane z:\n${rawUrl}`;

                const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE` +
                    `&text=${encodeURIComponent(data.title)}` +
                    `&dates=${gCalStart}/${gCalEnd}` +
                    `&details=${encodeURIComponent(fullDetails)}` +
                    `&location=${encodeURIComponent(data.location || '')}`;

                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                dayCard.innerHTML = `
                    <div>
                        <div class="day-name">Dzień ${day.day_number} (${formatDate(startDate)})</div>
                        <div class="day-time">${formatTime(startDate)} - ${formatTime(endDate)}</div>
                    </div>
                    <a href="${gCalUrl}" target="_blank" class="btn-calendar">Dodaj do Kalendarza</a>
                `;
                daysList.appendChild(dayCard);
            });

            results.style.display = 'block';
        }
    </script>
</body>
</html>
