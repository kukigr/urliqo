<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urliqo – Generator Kalendarza</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #1c1e21;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 520px;
            padding: 28px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .header-icon {
            font-size: 24px;
        }

        h1 {
            color: #1a1a1a;
            font-size: 22px;
            font-weight: 700;
        }

        p.subtitle {
            color: #606770;
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px 40px 12px 14px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus {
            border-color: #1877f2;
        }

        /* Przycisk czyszczenia wewnątrz pola tekstowego */
        .btn-clear {
            position: absolute;
            right: 10px;
            background: #e4e6eb;
            border: none;
            color: #606770;
            font-size: 14px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: background 0.2s, color 0.2s;
        }

        .btn-clear:hover {
            background: #d8dadf;
            color: #050505;
        }

        button.btn-submit {
            width: 100%;
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-submit:hover {
            background-color: #166fe5;
        }

        button.btn-submit:disabled {
            background-color: #e4e6eb;
            color: #bcc0c4;
            cursor: not-allowed;
        }

        /* Loader z kręcącą się klepsydrą */
        .loader {
            display: none;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #1877f2;
            font-weight: 500;
        }

        .hourglass-icon {
            display: inline-block;
            animation: spin 1.5s infinite linear;
            margin-right: 6px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            margin-top: 16px;
            color: #fa383e;
            font-size: 14px;
            line-height: 1.4;
        }

        .error-details {
            font-size: 12px;
            color: #65676b;
            margin-top: 4px;
        }

        .results {
            display: none;
            margin-top: 20px;
            border-top: 1px solid #e4e6eb;
            padding-top: 20px;
        }

        .event-title {
            font-size: 18px;
            font-weight: 700;
            color: #1c1e21;
            margin-bottom: 6px;
        }

        .event-location {
            font-size: 13px;
            color: #606770;
            margin-bottom: 6px;
        }

        .event-source {
            font-size: 12px;
            color: #606770;
            margin-bottom: 16px;
            word-break: break-all;
        }

        .event-source a {
            color: #1877f2;
            text-decoration: none;
        }

        .event-source a:hover {
            text-decoration: underline;
        }

        .days-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-card {
            background-color: #f7f8fa;
            border: 1px solid #e4e6eb;
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .day-name {
            font-weight: 600;
            font-size: 14px;
            color: #1c1e21;
        }

        .day-time {
            font-size: 12px;
            color: #606770;
        }

        .btn-calendar {
            background-color: #42b72a;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-calendar:hover {
            background-color: #36a420;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="header-icon">📅</span>
            <h1>Urliqo</h1>
        </div>
        
        <p class="subtitle">Wklej link do wydarzenia (np. z Facebooka, Going itp.):</p>

        <form id="eventForm">
            <div class="input-wrapper">
                <input type="url" id="urlInput" placeholder="https://..." required autocomplete="off">
                <button type="button" class="btn-clear" id="btnClear" title="Wyczyść pole">✕</button>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Generuj linki do Kalendarza</button>
        </form>

        <div class="loader" id="loader">
            <span class="hourglass-icon">⏳</span> Analizowanie strony przez AI...
        </div>
        
        <div class="error-message" id="errorMessage">
            <div id="errorTitle"></div>
            <div class="error-details" id="errorDetails"></div>
        </div>

        <div class="results" id="results">
            <div class="event-title" id="eventTitle"></div>
            <div class="event-location" id="eventLocation"></div>
            <div class="event-source" id="eventSource"></div>
            <div class="days-list" id="daysList"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('eventForm');
        const urlInput = document.getElementById('urlInput');
        const btnClear = document.getElementById('btnClear');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('errorMessage');
        const errorTitle = document.getElementById('errorTitle');
        const errorDetails = document.getElementById('errorDetails');
        const results = document.getElementById('results');
        const eventTitle = document.getElementById('eventTitle');
        const eventLocation = document.getElementById('eventLocation');
        const eventSource = document.getElementById('eventSource');
        const daysList = document.getElementById('daysList');

        // Pokazuj/ukrywaj przycisk "Wyczyść" zależnie od wpisanego tekstu
        urlInput.addEventListener('input', () => {
            btnClear.style.display = urlInput.value.length > 0 ? 'flex' : 'none';
        });

        // Obsługa kliknięcia "Wyczyść"
        btnClear.addEventListener('click', () => {
            urlInput.value = '';
            btnClear.style.display = 'none';
            errorMessage.style.display = 'none';
            results.style.display = 'none';
            urlInput.focus();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();

            if (!url) return;

            // Reset stanu
            errorMessage.style.display = 'none';
            results.style.display = 'none';
            loader.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/parse-event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Wystąpił nieznany błąd.', data.details || '');
                    return;
                }

                renderResults(data);

            } catch (err) {
                showError('Błąd połączenia z serwerem', 'Sprawdź swoje połączenie internetowe i spróbuj ponownie.');
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function showError(title, details) {
            errorTitle.textContent = title;
            errorDetails.textContent = details;
            errorMessage.style.display = 'block';
        }

        function renderResults(data) {
            eventTitle.textContent = data.title;
            eventLocation.textContent = data.location ? `📍 ${data.location}` : '📍 Brak podanej lokalizacji';

            // Generowanie klikalnego linku źródłowego na stronie
            const rawUrl = data.source_url || urlInput.value.trim();
            const formattedSourceUrl = rawUrl.startsWith('http') ? rawUrl : `https://${rawUrl}`;
            eventSource.innerHTML = `🔗 Wydarzenie wygenerowane z: <a href="${formattedSourceUrl}" target="_blank" rel="noopener noreferrer">${formattedSourceUrl}</a>`;

            daysList.innerHTML = '';

            data.days.forEach(day => {
                const startDate = new Date(day.start_time_utc);
                const endDate = new Date(day.end_time_utc);

                const formatDate = (date) => date.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
                const formatTime = (date) => date.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });

                const gCalStart = startDate.toISOString().replace(/-|:|\.\d\d\d/g, '');
                const gCalEnd = endDate.toISOString().replace(/-|:|\.\d\d\d/g, '');

                // Dodano \n przed adresem URL w opisie, co zmusza Kalendarz Google do zamiany tekstu w aktywny link
                const detailsText = `Wydarzenie wygenerowane z:\n${formattedSourceUrl}`;

                const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(data.title)}&dates=${gCalStart}/${gCalEnd}&details=${encodeURIComponent(detailsText)}&location=${encodeURIComponent(data.location || '')}`;
                
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                dayCard.innerHTML = `
                    <div class="day-info">
                        <div class="day-name">Dzień ${day.day_number} (${formatDate(startDate)})</div>
                        <div class="day-time">${formatTime(startDate)} - ${formatTime(endDate)}</div>
                    </div>
                    <a href="${gCalUrl}" target="_blank" class="btn-calendar">Dodaj do Kalendarza</a>
                `;

                daysList.appendChild(dayCard);
            });

            results.style.display = 'block';
        }
    </script>
</body>
</html>
